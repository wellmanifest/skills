[project]
name = "wellmanifest-skills"
version = "0.3.0.dev0"
description = "Wellmanifest governed skills, execution plans, grants, receipts, and operation profile conformance"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.wellmanifest]
standard = "0.20.32"
revision = "b6ba9c21a65a6a5648ecf904b64c3b75295e136f"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
pythonpath = [".", "standard"]
testpaths = ["tests", "standard"]
