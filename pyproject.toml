[project]
name = "wellmanifest-skills"
version = "0.3.0.dev0"
description = "Wellmanifest governed skills, execution plans, grants, receipts, and operation profile conformance"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.wellmanifest]
standard = "0.20.163"
revision = "6738f734d7f19e178996c671c26e4165e8b21d4a"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
pythonpath = [".", "standard"]
testpaths = ["tests", "standard"]
